name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # BetterMob ist ein privates Repo: Secret BETTERMOB_TOKEN = Personal Access Token
      # (fine-grained, Contents: read auf HyperGaming99/bettermob).
      - name: Checkout BetterMob
        uses: actions/checkout@v4
        with:
          repository: HyperGaming99/bettermob
          token: ${{ secrets.BETTERMOB_TOKEN }}
          path: .bettermob

      - name: Install BetterMob API
        run: mvn -B -ntp -f .bettermob/pom.xml install -DskipTests

      - name: Build
        run: mvn -B -ntp package

      - name: Read version
        id: v
        run: echo "version=$(mvn -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: BetterMobCrucible
          path: target/BetterMobCrucible-*.jar

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: BetterMobCrucible ${{ steps.v.outputs.version }}
          body: Automatischer Build von ${{ github.sha }}
          files: target/BetterMobCrucible-${{ steps.v.outputs.version }}.jar
          fail_on_unmatched_files: true
