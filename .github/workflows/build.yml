name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build
        run: mvn -B -ntp package

      - name: Read version
        id: v
        run: echo "version=$(mvn -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: BetterMobCrucible
          path: target/BetterMobCrucible-*.jar

      # Pro Version genau ein Release: bei jedem Push wird es samt Tag auf den neuen Commit
      # gesetzt und mit der frischen JAR neu erstellt. Neue Version = <version> in der pom.xml.
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release delete "v$VERSION" --cleanup-tag --yes || true
          gh release create "v$VERSION" "target/BetterMobCrucible-$VERSION.jar" \
            --target "$GITHUB_SHA" \
            --title "BetterMobCrucible $VERSION" \
            --generate-notes
