name: Build and Release

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: List commits since the last release
        if: github.event_name != 'pull_request'
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -1)
          range=${last:+$last..HEAD}
          {
            echo "## Commits${last:+ since $last}"
            echo
            git log $range --pretty=format:"- %s ([\`%h\`](https://github.com/${{ github.repository }}/commit/%H))"
            echo
          } > "$RUNNER_TEMP/commits.md"

      - name: Sync the BetterMob API from BetterMob's dev branch
        run: .github/scripts/sync-bettermob-api.sh dev

      - name: Build
        run: mvn -B clean package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bettermobcrucible-jar
          path: target/BetterMobCrucible-*.jar

      # Neue Version = <version> in der pom.xml (und plugin.yml) hochzaehlen und auf main pushen;
      # gibt es den Tag v<version> noch nicht, wird er samt Release angelegt.
      - name: Check for new version
        id: version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: BetterMobCrucible ${{ steps.version.outputs.version }}
          files: target/BetterMobCrucible-*.jar
          body_path: ${{ runner.temp }}/commits.md
          generate_release_notes: true
