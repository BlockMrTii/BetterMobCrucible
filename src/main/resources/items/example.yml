# Items fuer BetterMobCrucible. Skills-Zeilen sind BetterMob-Mechanics mit Trigger-Suffix:
# ~onUse, ~onSwing, ~onPressF, ~onEquip, ~onPickup, ~onDrop, ~onTimer:<ticks>
# Geben: /bettermobcrucible give example_wand
example_wand:
  Material: STICK
  Display: '&bBeispiel-Stab'
  Lore:
    - '&7Rechtsklick fuer einen Sound'
  Skills:
    - sound{s=entity.experience_orb.pickup;p=1;v=1} @self ~onUse
    - setitemnbt{key=uses;value=1} @self ~onUse
